edition = "2024";
package dogma.example.messages.commands.v1;

option features.field_presence = IMPLICIT;

import "src/example/messages/transaction.proto";

// Withdraw is a command requesting that funds be withdrawn from a bank account.
message Withdraw {
  string transaction_id = 1;
  string account_id = 2;
  int64 amount = 3;
  string scheduled_time = 4;
}

// ApproveWithdrawal is a command that approves an account withdrawal.
message ApproveWithdrawal {
  string transaction_id = 1;
  string account_id = 2;
  int64 amount = 3;
}

// DeclineWithdrawal is a command that rejects an account withdrawal.
message DeclineWithdrawal {
  string transaction_id = 1;
  string account_id = 2;
  int64 amount = 3;
  dogma.example.messages.v1.DebitFailureReason reason = 4;
}
